<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ultimate Humanizer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f12;
      color: #e0e0e6;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #17171c;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 { color: #5865F2; margin-bottom: 5px; }
    p { color: #a3a3b3; font-size: 14px; }
    textarea {
      width: 100%;
      height: 120px;
      background: #202027;
      border: 2px solid #2f2f3d;
      border-radius: 8px;
      color: white;
      padding: 12px;
      font-size: 15px;
      box-sizing: border-box;
      resize: none;
    }
    textarea:focus { border-color: #5865F2; outline: none; }
    .control-panel {
      margin: 20px 0;
      text-align: left;
    }
    label { font-weight: bold; color: #5865F2; display: block; margin-bottom: 5px; }
    select {
      width: 100%;
      padding: 10px;
      background: #202027;
      border: 2px solid #2f2f3d;
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }
    button {
      background: #5865F2;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #4752c4; }
    .copy-btn {
      background: #23a55a;
      margin-top: 10px;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      color: white;
      width: 100%;
      cursor: pointer;
    }
    .copy-btn:hover { background: #1a7a42; }
    .result-box {
      margin-top: 25px;
      background: #202027;
      border: 1px dashed #4f4f5f;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
    }
    .result-box h3 { margin-top: 0; color: #5865F2; }
    #output { font-size: 15px; line-height: 1.5; color: #ffffff; white-space: pre-wrap; }
    .counter { text-align: right; font-size: 12px; color: #72767d; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>✨ Premium Message Humanizer ✨</h1>
    <p>Spill your story, select your tone, and generate the perfect text response.</p>
    
    <textarea id="userStory" oninput="updateCount()" placeholder="Example: Tell my boss I am sick because of bad food..."></textarea>
    <div class="counter" id="charCount">0 characters</div>
    
    <div class="control-panel">
      <label for="toneSelect">🎭 Choose Your Message Style:</label>
      <select id="toneSelect">
        <option value="casual text format">Casual Text (For Friends)</option>
        <option value="professional email format">Professional Email (For Work/School)</option>
        <option value="chaotic panicked text message format">Slightly Chaotic / Panic Mode</option>
      </select>
    </div>

    <button onclick="humanizeMessage()">Humanize It!</button>

    <div class="result-box">
      <h3>Your Perfect Message:</h3>
      <p id="output">Your upgraded text draft will appear right here...</p>
      <button class="copy-btn" id="copyButton" onclick="copyText()" style="display:none;">📋 Copy to Clipboard</button>
    </div>
  </div>

  <script>
    function updateCount() {
      const text = document.getElementById('userStory').value;
      document.getElementById('charCount').innerText = text.length + " characters";
    }

    async function humanizeMessage() {
      const input = document.getElementById('userStory').value;
      const tone = document.getElementById('toneSelect').value;
      const outputDiv = document.getElementById('output');
      const copyBtn = document.getElementById('copyButton');
      
      if (!input.trim()) {
        outputDiv.innerText = "Please type something first!";
        copyBtn.style.display = "none";
        return;
      }

      outputDiv.innerText = "✨ Connecting to free AI model... please wait a brief moment...";
      copyBtn.style.display = "none";

      try {
        // This public endpoint natively permits open browser connections without throwing errors
        const response = await fetch("https://huggingface.co", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inputs: `<|im_start|>system\nYou are a regular person helper. Rewrite the user input message into a natural human text with zero explanation or AI intro text. Style/format option requested: ${tone}.<|im_end|>\n<|im_start|>user\n${input}<|im_end|>\n<|im_start|>assistant\n`
          })
        });

        const data = await response.json();
        
        if (data && data[0] && data[0].generated_text) {
          const rawText = data[0].generated_text;
          // Filter out system tags from the model engine output response payload
          const cleanText = rawText.split("<|im_start|>assistant\n").pop().replace("<|im_end|>", "").trim();
          
          outputDiv.innerText = cleanText;
          copyBtn.style.display = "block";
          copyBtn.innerText = "📋 Copy to Clipboard";
        } else {
          outputDiv.innerText = "The free AI server model is warming up. Please wait 5 seconds and try clicking again!";
        }

      } catch (error) {
        console.error(error);
        outputDiv.innerText = "An error occurred fetching data from the endpoint loop. Click humanize once more!";
      }
    }

    function copyText() {
      const textToCopy = document.getElementById('output').innerText;
      navigator.clipboard.writeText(textToCopy);
      document.getElementById('copyButton').innerText = "✅ Copied Successfully!";
    }
  </script>

</body>
</html>
